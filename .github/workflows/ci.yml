name: CI

on:
  push:
  pull_request:

jobs:
  guardrail:
    name: Brand and license guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Nothing from the source store ships: no brand, no Font Awesome Pro.
      # The brackets keep these patterns from matching this file itself;
      # each is the same regex as the plain word.
      - name: Fail on source-store names and Font Awesome
        run: |
          if rg -i --hidden -g '!.git' "all[d]igital|font[a]wesome|fa[-]light" .; then
            echo "::error::Source-store or Font Awesome reference found."
            exit 1
          fi

      - name: Fail on demo data and copy that must not ship
        run: |
          if rg -i --hidden -g '!.git' "dah[u]a|hil[o]ok|\+99[5]|chat[g]pt|cl[a]ude|\p{Georgian}" .; then
            echo "::error::Store-specific sample data, Georgian copy or assistant brand names found."
            exit 1
          fi

  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    needs: guardrail
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            illuminate: '^12.41.1'
            testbench: '^10.8'
          - laravel: '13'
            illuminate: '^13.0'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, dom, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.illuminate }}" --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/pest

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
